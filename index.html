<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Analisador Multicanal</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        :root { --bg: #121214; --panel: #202024; --text: #e1e1e6; --primary: #04d361; --border: #323238; }
        body { font-family: sans-serif; background-color: var(--bg); color: var(--text); padding: 1rem; }
        .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
        button { padding: 0.8rem; border-radius: 4px; border: none; cursor: pointer; background: var(--primary); font-weight: bold; }
        .channel-list { display: flex; gap: 0.5rem; margin-bottom: 1rem; overflow-x: auto; }
        .channel-btn { background: #323238; color: white; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; }
        .channel-btn.active { border: 2px solid var(--primary); }
        .canvas-container { position: relative; background: #fff; border-radius: 4px; }
        canvas { display: block; width: 100%; height: 250px; }
    </style>
</head>
<body>

<div id="app">
    <div class="card">
        <h3>Seletor de Canais</h3>
        <div class="channel-list">
            <div v-for="ch in channels" :key="ch.id" 
                 class="channel-btn" 
                 :class="{active: activeChannelId === ch.id}"
                 @click="activeChannelId = ch.id">
                 {{ ch.name }}
            </div>
            <button @click="addChannel">+</button>
        </div>
        
        <div style="display:flex; gap: 10px; margin-bottom: 1rem;">
            <button @click="startSweep" :disabled="isRunning">Gravar {{ channels.find(c => c.id === activeChannelId).name }}</button>
            <button @click="clearActive" style="background:#f75a68">Limpar Canal</button>
        </div>
    </div>

    <div class="card">
        <div class="canvas-container">
            <canvas id="chartCanvas" width="800" height="300"></canvas>
        </div>
    </div>
</div>

<script>
    const { createApp, ref, reactive, onMounted, watch } = Vue;

    createApp({
        setup() {
            const config = reactive({ minFreq: 400, maxFreq: 1500, duration: 8 });
            const channels = reactive([
                { id: 0, name: 'Base', data: [], color: '#04d361' },
                { id: 1, name: 'Objeto', data: [], color: '#8257e5' }
            ]);
            const activeChannelId = ref(0);
            const isRunning = ref(false);
            
            let canvas, ctx, audioCtx, analyzer, micStream, oscillator, startTime, animationFrameId;

            const addChannel = () => {
                const id = channels.length;
                const colors = ['#FF5733', '#33FF57', '#3357FF', '#F333FF'];
                channels.push({ id, name: 'Ch ' + (id+1), data: [], color: colors[id % colors.length] });
            };

            const clearActive = () => { channels.find(c => c.id === activeChannelId.value).data = []; draw(); };

            const draw = () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                channels.forEach(ch => {
                    if (!ch.data.length) return;
                    ctx.beginPath();
                    ch.data.forEach((p, i) => {
                        const x = ((p.f - config.minFreq) / (config.maxFreq - config.minFreq)) * canvas.width;
                        const y = canvas.height - (p.a * 3); // Escala fixa para comparação visual
                        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                    });
                    ctx.strokeStyle = ch.color;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                });
            };

            const startSweep = async () => {
                isRunning.value = true;
                const targetChannel = channels.find(c => c.id === activeChannelId.value);
                targetChannel.data = [];
                
                micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, autoGainControl: false, noiseSuppression: false }});
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyzer = audioCtx.createAnalyser();
                audioCtx.createMediaStreamSource(micStream).connect(analyzer);
                
                oscillator = audioCtx.createOscillator();
                oscillator.frequency.setValueAtTime(config.minFreq, audioCtx.currentTime);
                oscillator.frequency.linearRampToValueAtTime(config.maxFreq, audioCtx.currentTime + config.duration);
                oscillator.connect(audioCtx.destination);
                oscillator.start();

                startTime = performance.now();
                const loop = () => {
                    const elapsed = (performance.now() - startTime) / 1000;
                    if (elapsed >= config.duration) { finalize(); return; }
                    
                    const freq = config.minFreq + ((config.maxFreq - config.minFreq) * (elapsed / config.duration));
                    const buffer = new Uint8Array(analyzer.frequencyBinCount);
                    analyzer.getByteTimeDomainData(buffer);
                    let min = 255, max = 0;
                    for (let b of buffer) { if(b < min) min = b; if(b > max) max = b; }
                    
                    targetChannel.data.push({ f: freq, a: (max - min) });
                    draw();
                    animationFrameId = requestAnimationFrame(loop);
                };
                loop();
            };

            const finalize = () => {
                isRunning.value = false;
                oscillator.stop(); micStream.getTracks().forEach(t => t.stop());
                cancelAnimationFrame(animationFrameId);
            };

            onMounted(() => { canvas = document.getElementById('chartCanvas'); ctx = canvas.getContext('2d'); draw(); });

            return { channels, activeChannelId, isRunning, startSweep, clearActive, config, addChannel };
        }
    }).mount('#app');
</script>
</body>
</html>
